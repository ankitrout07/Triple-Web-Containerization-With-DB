version: '3.8'

services:
  lb:
    image: nginx:latest
    container_name: triple-web-db-lb-1
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web1
      - web2
      - web3
    networks:
      - app-network

  web1:
    build: ./src/web
    container_name: triple-web-db-web1-1
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: '50M'
    environment:
      - SITE_NAME=ALPHA
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=app_db
    volumes:
      - ./src/web/templates:/app/templates
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  web2:
    build: ./src/web
    container_name: triple-web-db-web2-1
    environment:
      - SITE_NAME=BETA
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=app_db
    volumes:
      - ./src/web/templates:/app/templates
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  web3:
    build: ./src/web
    container_name: triple-web-db-web3-1
    environment:
      - SITE_NAME=GAMMA
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=app_db
    volumes:
      - ./src/web/templates:/app/templates
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mariadb:10.6
    container_name: triple-web-db-db-1
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./db_data:/var/lib/mysql
      - ./infrastructure/mariadb/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge