<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple-Web Gateway | {{ site }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --accent: #10b981;
            --bg: #030712;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: #f8fafc;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Mesh Background */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            filter: blur(80px);
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-logo span { color: var(--primary); -webkit-text-fill-color: var(--primary); }

        .status-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .node-badge {
            background: var(--glass);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            border: 1px solid var(--glass-border);
            color: #38bdf8;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            padding: 3.5rem;
            border-radius: 32px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; color: #fff; }
        p.subtitle { color: #94a3b8; margin-bottom: 2.5rem; font-size: 1rem; }

        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #64748b; margin-bottom: 0.5rem; text-transform: uppercase; }

        input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        button {
            width: 100%;
            padding: 1.25rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 20px 40px -10px var(--primary-glow);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #475569;
        }

        @media (max-width: 640px) {
            .navbar { padding: 1rem 1.5rem; }
            .login-card { padding: 2rem; margin: 1rem; }
        }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>
    
    <nav class="navbar">
        <div class="nav-logo">TRIPLE-WEB <span>{{ site }}</span></div>
        <div class="status-container">
            <div class="node-badge">NODE: {{ node }}</div>
            <div class="pulse-dot"></div>
        </div>
    </nav>

    <div class="login-card">
        <h1>Infrastructure</h1>
        <p class="subtitle">Access protocol initialization required</p>
        
        <form method="POST">
            <div class="form-group">
                <label>Access Identity</label>
                <input name="user" placeholder="Enter UID" required>
            </div>
            <div class="form-group">
                <label>Security Key</label>
                <input name="pass" type="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Initialize Link</button>
        </form>

        <div class="footer-note">
            Protocol Version: 4.2.1 • Secured by MariaDB
        </div>
    </div>
</body>
</html>
